<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="A question is retrieved against indexed documents, answered by an agent, and returned as a cited answer">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8F9A"/>
    </marker>
  </defs>

  <!-- documents (corpus) -->
  <g stroke="#C7CBD4" stroke-width="2.5" fill="none">
    <rect x="55" y="90" width="120" height="150" rx="10" fill="#252D38"/>
    <rect x="72" y="74" width="120" height="150" rx="10" fill="#2B3542"/>
    <rect x="90" y="58" width="120" height="150" rx="10" fill="#333F4E"/>
  </g>
  <g stroke="#C7CBD4" stroke-width="3" stroke-linecap="round">
    <line x1="112" y1="90" x2="188" y2="90"/>
    <line x1="112" y1="112" x2="178" y2="112"/>
    <line x1="112" y1="134" x2="188" y2="134"/>
    <line x1="112" y1="156" x2="160" y2="156"/>
  </g>
  <text x="150" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9AA0AC">corpus</text>

  <line x1="235" y1="150" x2="330" y2="150" stroke="#8A8F9A" stroke-width="3" marker-end="url(#arr)"/>

  <!-- agent -->
  <circle cx="400" cy="150" r="70" fill="none" stroke="#7C93FF" stroke-width="4"/>
  <circle cx="400" cy="120" r="9" fill="#7C93FF"/>
  <circle cx="368" cy="168" r="9" fill="#7C93FF"/>
  <circle cx="432" cy="168" r="9" fill="#7C93FF"/>
  <line x1="400" y1="120" x2="368" y2="168" stroke="#7C93FF" stroke-width="2.5"/>
  <line x1="400" y1="120" x2="432" y2="168" stroke="#7C93FF" stroke-width="2.5"/>
  <line x1="368" y1="168" x2="432" y2="168" stroke="#7C93FF" stroke-width="2.5"/>
  <text x="400" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9AA0AC">agent</text>

  <line x1="470" y1="150" x2="565" y2="150" stroke="#8A8F9A" stroke-width="3" marker-end="url(#arr)"/>

  <!-- cited answer -->
  <path d="M600,90 h150 a12,12 0 0 1 12,12 v90 a12,12 0 0 1 -12,12 h-95 l-25,28 v-28 h-30 a12,12 0 0 1 -12,-12 v-90 a12,12 0 0 1 12,-12 z"
        fill="#2B3542" stroke="#C7CBD4" stroke-width="2.5"/>
  <g stroke="#C7CBD4" stroke-width="3" stroke-linecap="round">
    <line x1="622" y1="122" x2="738" y2="122"/>
    <line x1="622" y1="144" x2="710" y2="144"/>
    <line x1="622" y1="166" x2="726" y2="166"/>
  </g>
  <text x="700" y="140" font-family="Arial, sans-serif" font-size="14" fill="#E0B84A" font-weight="700">[1]</text>
  <text x="700" y="184" font-family="Arial, sans-serif" font-size="14" fill="#E0B84A" font-weight="700">[2]</text>
  <text x="675" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#9AA0AC">cited answer</text>
</svg>
